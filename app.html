<!DOCTYPE html>
<html lang="tr">
<head>

<link rel="manifest" href="manifest-pc.webmanifest">

<script>if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))location.replace('index.html');</script>
<style>
:root{--g:#c59b27;--g2:#f9d976;--n:#082231;--ink:#031119;--card:rgba(255,255,255,.045);--bd:rgba(197,155,39,.22);--tb:env(titlebar-area-height,48px);--side:264px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#e2e8f0;font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1000px 600px at 8% -10%,rgba(197,155,39,.16),transparent 60%),radial-gradient(900px 700px at 110% 110%,rgba(30,90,140,.18),transparent 60%),linear-gradient(135deg,#082231,#031119 62%)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}
.gold{background:linear-gradient(90deg,var(--g),var(--g2),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.fj{font-family:'Fjalla One',sans-serif;font-weight:400;letter-spacing:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:linear-gradient(#c59b27,#8c6c16);border-radius:10px;border:2px solid var(--ink)}::-webkit-scrollbar-track{background:transparent}
/* titlebar */
#tb{position:fixed;z-index:40;left:env(titlebar-area-x,0);top:env(titlebar-area-y,0);width:env(titlebar-area-width,100%);height:var(--tb);display:flex;align-items:center;gap:8px;padding:0 12px;-webkit-app-region:drag;app-region:drag;user-select:none}
#tb button,#tb .no{-webkit-app-region:no-drag;app-region:no-drag}
.ib{width:36px;height:34px;border-radius:10px;color:#cbd5e1;display:inline-flex;align-items:center;justify-content:center;position:relative;transition:.2s}.ib:hover{background:rgba(255,255,255,.09);color:#fff}
.dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--g2);box-shadow:0 0 8px var(--g2)}
#sbar{flex:0 1 460px;margin:0 auto;height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;font-size:13px;transition:.2s}
#sbar:hover{border-color:var(--bd);background:rgba(255,255,255,.09)}#sbar kbd{margin-left:auto;font:11px Inter;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:1px 7px}
#me{display:flex;align-items:center;gap:9px;height:34px;padding:0 14px 0 4px;border-radius:999px;border:1px solid var(--bd);background:rgba(197,155,39,.1);color:var(--g2);font-weight:600;font-size:12.5px}
#me img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--n)}
/* side */
#side{position:fixed;z-index:20;left:0;top:var(--tb);bottom:0;width:var(--side);padding:8px 14px 14px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,rgba(8,34,49,.8),rgba(3,17,25,.8));backdrop-filter:blur(18px);border-right:1px solid rgba(197,155,39,.16);transition:width .3s}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 16px;overflow:hidden}.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 0 0 1.5px rgba(197,155,39,.55),0 0 20px rgba(197,155,39,.3)}.brand b{font-size:24px;white-space:nowrap}
.sec{font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:#64748b;padding:12px 10px 5px;white-space:nowrap}
.it{position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 10px 0 8px;border-radius:13px;color:#cbd5e1;font-weight:600;white-space:nowrap;overflow:hidden;transition:.2s;text-align:left;width:100%}
.it .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:#94a3b8;transition:.2s}.it:hover{background:rgba(255,255,255,.05);color:#fff;transform:translateX(3px)}
.it.on{background:linear-gradient(90deg,rgba(197,155,39,.24),rgba(197,155,39,.03));color:#fff}.it.on::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:linear-gradient(var(--g2),var(--g));box-shadow:0 0 12px var(--g2)}
.it.on .ic{background:linear-gradient(135deg,var(--g2),var(--g));color:#1a1202;box-shadow:0 6px 16px rgba(197,155,39,.4)}
#pcard{margin-top:auto;display:flex;align-items:center;gap:11px;padding:11px;border-radius:16px;background:var(--card);border:1px solid var(--bd);overflow:hidden;white-space:nowrap;text-align:left;width:100%}
#pcard img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--g);flex:none;background:var(--n)}#pcard b{display:block;font-size:13.5px;color:#fff}#pcard small{color:#94a3b8;font-size:11.5px}
body.col{--side:84px}body.col .brand b,body.col .it span:not(.ic),body.col .sec,body.col #pcard div{opacity:0}
/* stage */
#stage{position:fixed;z-index:10;left:calc(var(--side) + 8px);right:10px;top:var(--tb);bottom:10px;border-radius:20px;overflow:auto;background:rgba(3,17,25,.55);box-shadow:0 0 0 1px var(--bd),0 24px 60px rgba(0,0,0,.5);transition:left .3s}
#page{max-width:1380px;margin:0 auto;padding:30px 36px 50px;animation:in .45s both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1.pt{font-size:34px;margin:0 0 4px;color:#fff}.sub{color:#94a3b8;margin:0 0 24px}
h3.sh{display:flex;align-items:center;gap:10px;font-size:22px;margin:34px 0 14px;color:#fff}h3.sh::before{content:'';width:4px;height:22px;border-radius:3px;background:linear-gradient(var(--g2),var(--g))}h3.sh a{margin-left:auto;font:600 12.5px Inter;color:var(--g2);letter-spacing:0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;transition:.25s}
.hero{position:relative;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;padding:34px;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,rgba(197,155,39,.2),rgba(8,34,49,.85) 55%),url(https://lh3.googleusercontent.com/d/1COmvON6lpTquzx575AKQbpXcTIgA-969) right -40px center/380px no-repeat;border:1px solid var(--bd)}
.hero h1{font-size:44px;line-height:1.1;margin:6px 0 10px;color:#fff}.hero p{color:#cbd5e1;max-width:520px;margin:0 0 20px}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--bd);font-size:12px;color:#cbd5e1}.chip b{display:block;font-size:20px;color:var(--g2);font-family:'Fjalla One';font-weight:400}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:12px;font-weight:700;color:#1a1202;background:linear-gradient(135deg,var(--g2),var(--g));box-shadow:0 8px 22px rgba(197,155,39,.3);transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.o{background:rgba(255,255,255,.06);color:#fff;box-shadow:none;border:1px solid var(--bd)}
.mx{padding:20px;align-self:center}.mx .row{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}.mx .tm{flex:1}.mx .tm i{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--n);border:1.5px solid var(--g);font:normal 20px 'Fjalla One';color:var(--g2)}.mx .vs{font:26px 'Fjalla One';color:var(--g2)}
.stories{display:flex;gap:22px;overflow-x:auto;padding:4px 2px 8px}.st{flex:none;width:92px;text-align:center}.st .rg{width:88px;height:88px;border-radius:50%;padding:3px;background:conic-gradient(#ffe27a,#ffd34d,#c59b27,#ffe27a);transition:.2s}.st:hover .rg{transform:scale(1.07)}.st .rg i{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--ink);background:#082231 center/cover}.st.sn .rg{background:#4b5866}.st span{display:block;margin-top:7px;font-size:12px;font-weight:700;color:#e2e8f0}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.news{overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.news:hover,.pl:hover,.pr:hover{transform:translateY(-5px);border-color:var(--g);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 26px rgba(197,155,39,.22)}
.news .im{height:170px;background:#082231 center/cover}.news .bd{padding:16px}.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;color:#1a1202;background:linear-gradient(135deg,var(--g2),var(--g));margin-bottom:8px}.news h4{margin:0 0 6px;font-size:16px;line-height:1.35;color:#fff}.news p{margin:0;color:#94a3b8;font-size:12.5px}.news small{display:block;margin-top:10px;color:#64748b}
.pl{position:relative;overflow:hidden;aspect-ratio:3/4;cursor:default}.pl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}.pl:hover img{transform:scale(1.06)}.pl::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(3,17,25,.96))}.pl .in{position:absolute;z-index:2;left:16px;right:16px;bottom:14px}.pl .nm{font:22px 'Fjalla One';color:#fff}.pl .no{position:absolute;z-index:2;top:12px;left:14px;font:34px 'Fjalla One';color:var(--g2)}.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center;font-size:10.5px;color:#94a3b8}.st4 b{display:block;font-size:15px;color:var(--g2)}
.pr{overflow:hidden;cursor:pointer}.pr .im{aspect-ratio:1;background:#eef2f7;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}.pr img{max-width:100%;max-height:100%;object-fit:contain}.pr .oos{position:absolute;left:0;right:0;bottom:0;text-align:center;padding:5px;font-size:11px;font-weight:800;letter-spacing:1px;color:#fff;background:rgba(8,34,49,.9)}.pr .bd{padding:13px 15px}.pr h4{margin:0;font-size:13.5px;color:#fff;line-height:1.35}.pr b{color:var(--g2);font-size:16px}
.mc{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:12px}.mc .d{width:64px;text-align:center;font-size:11px;color:#94a3b8}.mc .d b{display:block;font:24px 'Fjalla One';color:var(--g2)}.mc .t{flex:1;font-weight:700;color:#fff}.mc .t small{display:block;font-weight:500;color:#94a3b8}.pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.08);color:#cbd5e1}.pill.up{background:rgba(197,155,39,.2);color:var(--g2)}
.tr{display:flex;gap:16px;flex-wrap:wrap}.tr div{flex:1;min-width:150px;padding:16px;text-align:center;font-size:12.5px;font-weight:700}.tr img{height:90px;display:block;margin:0 auto 8px;object-fit:contain}
/* forms / profile / wall */
.fm{display:grid;gap:12px;max-width:440px}.fm input,.fm textarea,.cmp textarea{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);outline:0;transition:.2s}.fm input:focus,.fm textarea:focus,.cmp textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(197,155,39,.18)}.fm label{font-size:11.5px;font-weight:700;color:#94a3b8;letter-spacing:.5px}.msg{font-size:13px;color:#f87171}.msg.ok{color:#4ade80}
.tabs{display:inline-flex;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:18px}.tabs button{padding:8px 22px;border-radius:10px;font-weight:700;color:#94a3b8}.tabs .on{background:linear-gradient(135deg,var(--g2),var(--g));color:#1a1202}
.pg{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}.mem{position:relative;padding:26px;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#0e3550,#082231 60%,#031119);border:1.5px solid var(--g);box-shadow:0 0 40px rgba(197,155,39,.2)}.mem::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(rgba(249,217,118,.3),transparent 70%)}
.mem .av{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--g);background:var(--n)}.mem h2{margin:12px 0 0;font-size:24px;color:#fff}.mem .cd{margin-top:18px;padding-top:14px;border-top:1px dashed var(--bd);display:flex;justify-content:space-between}.mem small{color:#94a3b8;display:block;font-size:10.5px;letter-spacing:1px}.mem b.m{font-family:ui-monospace,monospace;color:var(--g2)}
.cmp{padding:16px;margin-bottom:16px}.cmp textarea{height:84px;resize:none;margin-bottom:10px}.po{padding:16px 18px;margin-bottom:12px}.po .h{display:flex;align-items:center;gap:10px;margin-bottom:6px;color:#fff;font-weight:700}.po .h small{color:#64748b;font-weight:500}.po p{margin:0;color:#cbd5e1;white-space:pre-wrap;word-break:break-word}
/* overlays */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(2,10,16,.72);backdrop-filter:blur(8px)}.ov.on{display:flex}
.pal{width:min(640px,92vw);border-radius:20px;overflow:hidden;background:#071d2b;border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,0,0,.7);animation:in .25s both}.pal input{width:100%;height:58px;padding:0 22px;font-size:17px;background:none;border:0;border-bottom:1px solid var(--bd);outline:0}.pal .rs{max-height:52vh;overflow:auto;padding:8px}.pal .r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer}.pal .r:hover,.pal .r.on{background:rgba(197,155,39,.16)}.pal .r i{width:32px;text-align:center;color:var(--g2)}.pal .r small{margin-left:auto;color:#64748b}
#pop{position:fixed;z-index:60;top:calc(var(--tb) + 4px);right:150px;width:320px;padding:18px;border-radius:18px;background:#071d2b;border:1px solid var(--bd);box-shadow:0 20px 50px rgba(0,0,0,.6);display:none;text-align:center;color:#94a3b8}#pop.on{display:block;animation:in .2s both}#pop i{display:flex;width:54px;height:54px;margin:0 auto 10px;border-radius:50%;align-items:center;justify-content:center;font-size:22px;color:var(--g2);background:rgba(197,155,39,.1);border:1px solid var(--bd)}
.web{position:fixed;inset:var(--tb) 10px 10px calc(var(--side) + 8px);z-index:70;display:none;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--ink);box-shadow:0 0 0 1px var(--g),0 30px 80px rgba(0,0,0,.7)}.web.on{display:flex}.web .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#071d2b;border-bottom:1px solid var(--bd);font-weight:700;color:#fff}.web iframe{flex:1;border:0;background:var(--ink)}
#sv{align-items:center;padding:0}.sv{position:relative;width:min(420px,92vw);height:min(760px,92vh);border-radius:24px;overflow:hidden;background:#031119 center/cover;box-shadow:0 0 0 1px var(--g),0 30px 80px #000}.sv::before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(3,17,25,.96) 80%)}.sv .bs{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}.sv .bs i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}.sv .bs i b{display:block;height:100%;width:0;background:#fff}.sv .cp{position:absolute;z-index:3;left:22px;right:22px;bottom:26px}.sv h2{font-size:25px;line-height:1.25;margin:10px 0;color:#fff}.sv .x{position:absolute;z-index:4;top:22px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff}.sv .hit{position:absolute;inset:60px 0 0;z-index:2;display:flex}.sv .hit div{flex:1}
/* welcome */
#wel{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;background:radial-gradient(circle at 50% 38%,#0e3a54,#031119 68%);transition:opacity .8s,visibility .8s,transform .8s}body.in #wel{opacity:0;visibility:hidden;transform:scale(1.06)}
#wel::before,#wel::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(197,155,39,.18);animation:rg 7s linear infinite}#wel::before{width:560px;height:560px}#wel::after{width:820px;height:820px;animation-duration:11s;animation-direction:reverse}@keyframes rg{to{transform:rotate(360deg)}}
#wel img{position:relative;width:128px;height:128px;border-radius:32px;box-shadow:0 0 0 2px rgba(197,155,39,.7),0 0 70px rgba(249,217,118,.5);animation:fl 3.2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
#wel small{position:relative;letter-spacing:7px;color:#94a3b8;font-size:12px;font-weight:700}#wel h1{position:relative;margin:0;font-size:68px;letter-spacing:8px;background-size:200%;animation:sh 4s linear infinite}@keyframes sh{to{background-position:200%}}
#wel p{position:relative;margin:0 0 10px;color:#cbd5e1;font-size:16px}#wel .btn{position:relative;height:50px;padding:0 34px;font-size:15px}#wel em{position:relative;font-style:normal;font-size:11.5px;color:#64748b}
#toast{position:fixed;z-index:120;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;padding:11px 20px;border-radius:12px;background:#071d2b;border:1px solid var(--g);color:#fff;font-weight:600;transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.hero,.pg{grid-template-columns:1fr}.g2{grid-template-columns:1fr}:root{--side:84px}.brand b,.it span:not(.ic),.sec,#pcard div{display:none}}

[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}#fw{position:absolute;inset:0;width:100%;height:100%}#cf{position:fixed;inset:0;z-index:150;pointer-events:none}
#spot{position:fixed;left:0;top:0;width:520px;height:520px;z-index:50;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(249,217,118,.11),transparent 65%);transform:translate(-999px,-999px)}
@keyframes in{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.rv{opacity:0}.rv.vis{opacity:1;animation:rise .75s cubic-bezier(.2,.8,.2,1) var(--d,0ms) backwards}
.tilt{position:relative;transition:transform .12s ease-out,border-color .25s,box-shadow .25s;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}
.card.tilt:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.015)}
.tilt::before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(249,217,118,.2),transparent 60%)}.tilt:hover::before{opacity:1}
.btn{position:relative;overflow:hidden}.btn::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}.btn:hover::after{left:130%}
.rp{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}@keyframes rpl{to{transform:scale(5);opacity:0}}
.st:not(.sn) .rg{animation:pls 2.4s ease-in-out infinite}@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(249,217,118,.55)}50%{box-shadow:0 0 0 10px rgba(249,217,118,0)}}
.brand img{animation:glw 3s ease-in-out infinite}@keyframes glw{50%{box-shadow:0 0 0 1.5px rgba(197,155,39,.9),0 0 36px rgba(249,217,118,.65)}}
.it:hover .ic{transform:rotate(-8deg) scale(1.12)}.it.on .ic{animation:glw2 2.6s ease-in-out infinite}@keyframes glw2{50%{box-shadow:0 6px 26px rgba(249,217,118,.7)}}
.hero::after{content:'';position:absolute;width:320px;height:320px;right:28%;top:-130px;border-radius:50%;background:radial-gradient(rgba(249,217,118,.2),transparent 70%);animation:orb 8s ease-in-out infinite;pointer-events:none}@keyframes orb{50%{transform:translate(-70px,50px) scale(1.25)}}
.hero{background-position:0 0,right calc(-40px + var(--hx,0px)) top calc(50% - 190px + var(--hy,0px))!important}
.hero h1{background:linear-gradient(90deg,#fff,#f9d976,#fff);background-size:220%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
.tag{animation:tg 2.8s ease-in-out infinite}@keyframes tg{50%{box-shadow:0 0 14px rgba(249,217,118,.7)}}

#wel>small,#wel>p,#wel>em{animation:rise 1s .7s backwards}
.mc{transition:transform .12s ease-out,border-color .25s,box-shadow .25s}.mc:hover{border-color:var(--g)}
#wel::before,#wel::after,#wel canvas{pointer-events:none}

#wacc{position:relative;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-width:900px;min-height:170px;margin-top:6px;animation:rise 1s 1s backwards}
.ac{position:relative;width:150px;padding:20px 10px 15px;border-radius:22px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--bd);backdrop-filter:blur(10px);text-align:center;color:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .4s,border-color .25s,box-shadow .3s;animation:rise .7s backwards}
.ac:nth-child(2){animation-delay:.1s}.ac:nth-child(3){animation-delay:.2s}.ac:nth-child(4){animation-delay:.3s}
.ac:hover{transform:translateY(-9px) scale(1.05);border-color:var(--g2);box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 34px rgba(249,217,118,.32)}
.ac img,.ac .pl2{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2.5px solid var(--g);background:var(--n);display:flex;align-items:center;justify-content:center;margin:0 auto 11px;font-size:28px;color:var(--g2);box-shadow:0 0 22px rgba(197,155,39,.35)}
.ac .pl2{border-style:dashed;box-shadow:none}.ac:hover .pl2{background:rgba(197,155,39,.15)}
.ac b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#wel .ac small{display:block;letter-spacing:0;font-size:11.5px;font-weight:500;color:#94a3b8;animation:none}
.ac.act::after{content:'AKTİF';position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:999px;background:linear-gradient(135deg,var(--g2),var(--g));color:#1a1202}
.ac .rm{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;font-size:10px;color:#94a3b8;opacity:0;transition:.2s}.ac:hover .rm{opacity:1}.ac .rm:hover{background:rgba(255,255,255,.14);color:#fff}
.ac.ld img{animation:spn .8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
#wacc.sel .ac:not(.go){opacity:0;transform:scale(.7) translateY(14px);pointer-events:none}
.ac.go{transform:scale(1.28) translateY(-8px)!important;border-color:var(--g2);box-shadow:0 0 0 3px rgba(249,217,118,.55),0 0 80px rgba(249,217,118,.85)}.ac.go img{animation:pop .9s}@keyframes pop{40%{transform:scale(1.25) rotate(8deg)}}
.wf{position:fixed;z-index:101;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(rgba(249,217,118,.95),rgba(249,217,118,0) 70%);animation:wfa 1.1s ease-out forwards;pointer-events:none}@keyframes wfa{to{transform:scale(170);opacity:0}}
</style>

function tab(k){$('t1').classList.toggle('on',k==1);$('t2').classList.toggle('on',k==2);$('af').innerHTML=k==1?`<label>E-POSTA</label><input id="le" type="email"><label>ŞİFRE</label><input id="lp" type="password" onkeydown="event.key=='Enter'&&login()"><div class="msg" id="am"></div><button class="btn" onclick="login()">Giriş Yap</button>`:`<label>AD SOYAD</label><input id="rn"><label>KULLANICI ADI</label><input id="ru"><label>E-POSTA</label><input id="re" type="email"><label>ŞİFRE</label><input id="rp" type="password"><div class="msg" id="am"></div><button class="btn" onclick="reg()">Kayıt Ol</button>`}
const am=(t,ok)=>{const e=$('am')||$('em')||$('pm');if(e){e.textContent=t;e.className='msg'+(ok?' ok':'')}};
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value.trim()});if(error)return am('E-posta veya şifre hatalı!');toast('Giriş başarılı');burst(innerWidth/2,innerHeight/3)}
async function reg(){const{error}=await sb.auth.signUp({email:$('re').value.trim(),password:$('rp').value.trim(),options:{data:{name:$('rn').value.trim(),username:$('ru').value.trim().toLowerCase()}}});if(error)return am(error.message);am('Kayıt başarılı! Şimdi giriş yapabilirsin.',1);setTimeout(()=>tab(1),1200)}
async function out(){await sb.auth.signOut({scope:'local'});toast('Çıkış yapıldı');go('home')}
async function upd(){const{error}=await sb.from('profiles').update({name:$('en').value.trim(),username:$('eu').value.trim().toLowerCase(),avatar:$('ea').value.trim()}).eq('id',user.id);if(error)return am(error.message);toast('Bilgilerin güncellendi');load()}
async function pw(){const a=$('p1').value.trim();if(a.length<6)return am('Şifre en az 6 karakter olmalı!');if(a!==$('p2').value.trim())return am('Şifreler uyuşmuyor!');const{error}=await sb.auth.updateUser({password:a});if(error)return am(error.message);am('Şifren değiştirildi!',1)}
async function posts(){const b=$('posts');if(!b||!sb)return;const{data}=await sb.from('blog_posts').select('id,text,created_at,profiles(name,username)').order('created_at',{ascending:false}).limit(100);
  b.innerHTML=data&&data.length?data.map(p=>`<div class="card po"><div class="h"><span>${esc(p.profiles?p.profiles.name:'Aga Taraftarı')}</span><small>@${esc(p.profiles?p.profiles.username:'-')} • ${new Date(p.created_at).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div><p>${esc(p.text)}</p></div>`).join(''):'<p class="sub">Henüz gönderi yok. İlk düşünceyi sen paylaş!</p>'}
async function post(){const t=$('pt').value.trim();if(!t)return;const{error}=await sb.from('blog_posts').insert([{user_id:user.id,text:t}]);if(error)return toast('Paylaşılamadı');$('pt').value='';toast('Paylaşıldı');burst(innerWidth/2,innerHeight/2);posts()}

/* ---- efektler ---- */
function parts(c,n,sz){const x=c.getContext('2d');let W,H,A=[];const rs=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight};rs();addEventListener('resize',rs);
  for(let i=0;i<n;i++)A.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*sz+.6,v:Math.random()*.35+.08,a:Math.random()*6.28,s:Math.random()*.02+.004});
  (function f(){x.clearRect(0,0,W,H);for(const p of A){p.y-=p.v;p.a+=p.s;p.x+=Math.sin(p.a)*.4;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(249,217,118,'+(.2+.5*Math.abs(Math.sin(p.a*2)))+')';x.shadowColor='#f9d976';x.shadowBlur=10;x.fill()}requestAnimationFrame(f)})()}
parts($('fx'),70,2.2);parts($('fw'),120,2.8);
function burst(px,py){const c=$('cf'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const A=Array.from({length:90},()=>({x:px,y:py,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,r:Math.random()*5+3,c:['#f9d976','#c59b27','#fff','#5ec8ff'][Math.random()*4|0],a:Math.random()*6,t:0}));
  (function f(){g.clearRect(0,0,c.width,c.height);let n=0;for(const p of A){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=.22;p.t++;if(p.t<100){n++;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.globalAlpha=1-p.t/100;g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()}}if(n)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})()}
function fx(){const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('vis');io.unobserve(en.target)}}),{root:$('stage'),threshold:.06});
  document.querySelectorAll('#page h3.sh,#page .card,#page .st,#page .hero,#page .pt,#page .tabs').forEach(el=>{el.classList.add('rv');el.style.setProperty('--d',((el.parentElement?[...el.parentElement.children].indexOf(el):0)%7)*80+'ms');io.observe(el)});
  document.querySelectorAll('[data-n]').forEach(b=>{const n=+b.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
document.addEventListener('mousemove',e=>{$('spot').style.transform='translate('+(e.clientX-260)+'px,'+(e.clientY-260)+'px)';const T=e.target.closest&&e.target.closest('.tilt');
  if(T){const r=T.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;T.style.setProperty('--ry',((px-.5)*10).toFixed(2)+'deg');T.style.setProperty('--rx',((.5-py)*8).toFixed(2)+'deg');T.style.setProperty('--mx',(px*100)+'%');T.style.setProperty('--my',(py*100)+'%')}
  const H=e.target.closest&&e.target.closest('.hero');if(H){const r=H.getBoundingClientRect();H.style.setProperty('--hx',((e.clientX-r.left)/r.width-.5)*-40+'px');H.style.setProperty('--hy',((e.clientY-r.top)/r.height-.5)*-24+'px')}});
document.addEventListener('mouseout',e=>{const T=e.target.closest&&e.target.closest('.tilt');if(T&&!T.contains(e.relatedTarget)){T.style.setProperty('--rx','0deg');T.style.setProperty('--ry','0deg')}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rp';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';b.appendChild(s);setTimeout(()=>s.remove(),650)});
/* ---- Chrome ile yükleme ---- */
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!matchMedia('(display-mode: standalone)').matches)$('inst').hidden=false});
$('inst').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('inst').hidden=true};
addEventListener('appinstalled',()=>{$('inst').hidden=true;burst(innerWidth/2,innerHeight/3);toast('Uygulama yüklendi 🎉')});

/* ---- karşılama: hesap seçici ---- */
const AK='aga_accts';let busy=0;
const accts=()=>{try{return JSON.parse(localStorage.getItem(AK)||'[]')}catch(e){return[]}},saveA=a=>{try{localStorage.setItem(AK,JSON.stringify(a))}catch(e){}};
function remember(u,se){saveA([{id:u.id,name:u.name,username:u.username,avatar:u.avatar||'',at:se.access_token,rt:se.refresh_token},...accts().filter(x=>x.id!==u.id)])}
function welcome(v){const w=$('wacc');if(!w)return;w.classList.remove('sel');const a=accts();
  if(v==='login'||!a.length||!sb){w.innerHTML=sb?`<div class="fm" style="width:340px;margin:0 auto;animation:rise .6s backwards"><input id="wle" type="email" placeholder="E-posta" autocomplete="username"><input id="wlp" type="password" placeholder="Şifre" autocomplete="current-password" onkeydown="if(event.key=='Enter')wlogin()"><div class="msg" id="wm"></div><button class="btn" style="justify-content:center" onclick="wlogin()"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button><div style="display:flex;gap:10px"><button class="btn o" style="flex:1;justify-content:center" onclick="guestIn()"><i class="fa-solid fa-user-secret"></i> Misafir Olarak Devam Et</button>${a.length?'<button class="btn o" title="Hesaplara dön" onclick="welcome(\'list\')"><i class="fa-solid fa-arrow-left"></i></button>':''}</div></div>`:`<div class="ac" onclick="guestIn()"><div class="pl2"><i class="fa-solid fa-user-secret"></i></div><b>Misafir</b><small>Hesapsız devam et</small></div>`;
    $('wmsg').textContent=sb?'Giriş yap veya misafir olarak devam et.':'Misafir olarak devam edebilirsin.';setTimeout(()=>{const e=$('wle');e&&e.focus()},60);return}
  w.innerHTML=a.map(x=>`<div class="ac ${user&&user.id===x.id?'act':''}" id="ac_${x.id}" onclick="pickA('${x.id}')"><button class="rm" title="Listeden kaldır" onclick="event.stopPropagation();forget('${x.id}')"><i class="fa-solid fa-xmark"></i></button><img src="${esc(av(x))}" alt=""><b>${esc(x.name)}</b><small>@${esc(x.username)}</small></div>`).join('')
   +`<div class="ac" onclick="welcome('login')"><div class="pl2"><i class="fa-solid fa-plus"></i></div><b>Başka Hesap</b><small>Giriş yap</small></div><div class="ac" onclick="guestIn()"><div class="pl2"><i class="fa-solid fa-user-secret"></i></div><b>Misafir</b><small>Hesapsız devam et</small></div>`;
  $('wmsg').textContent='Devam etmek için hesabını seç.'}
function forget(id){saveA(accts().filter(x=>x.id!==id));welcome('list')}
function done(el,name){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},x=r.left+r.width/2,y=r.top+r.height/2;$('wacc').classList.add('sel');if(el)el.classList.add('go');
  $('wmsg').innerHTML=hello()+', <b style="color:#f9d976">'+esc(String(name).split(' ')[0])+'</b> ✨';if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
  burst(x,y);const f=document.createElement('div');f.className='wf';f.style.left=x+'px';f.style.top=y+'px';$('wel').appendChild(f);setTimeout(()=>{enter();busy=0;f.remove()},1150)}
async function pickA(id){if(busy)return;busy=1;const a=accts().find(x=>x.id===id),c=$('ac_'+id);if(!a||!c){busy=0;return}
  if(!(user&&user.id===id)){c.classList.add('ld');const{error}=await sb.auth.setSession({access_token:a.at,refresh_token:a.rt});c.classList.remove('ld');
    if(error){busy=0;$('wmsg').innerHTML='<span style="color:#f87171">Oturum süresi dolmuş. Şifrenle tekrar giriş yap.</span>';setTimeout(()=>welcome('login'),1500);return}await load()}
  done(c,a.name)}
async function wlogin(){if(busy)return;const e=$('wle').value.trim(),p=$('wlp').value.trim();if(!e||!p){$('wm').textContent='E-posta ve şifre gerekli.';return}
  busy=1;const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){busy=0;$('wm').textContent='E-posta veya şifre hatalı!';return}
  await load();welcome('list');busy=1;done(user?$('ac_'+user.id):null,user?user.name:'Taraftar')}
async function guestIn(){if(busy)return;busy=1;if(sb)try{await sb.auth.signOut({scope:'local'})}catch(e){}user=null;await load();done(null,'Misafir')}
function switchA(){busy=0;document.body.classList.remove('in');welcome('list')}
/* ---- yönlendirme ---- */
function render(){document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.p===cur));$('pcard').style.borderColor=cur==='profile'?'var(--g)':'';const pg=$('page');pg.style.animation='none';pg.offsetHeight;pg.style.animation='';pg.innerHTML=P[cur]();$('stage').scrollTop=0;if(cur==='profile'&&!user)tab(1);if(cur==='wall')posts();fx()}
function go(p){cur=p;history.replaceState(null,'','#'+p);document.title=PAGES[p]+' • AGA App';render()}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));$('me').onclick=()=>go('profile');
/* ---- hikaye ---- */
let sk=0,sf=0,stm=null;
function story(k){sk=k;sf=0;if(!seen.includes(k)){seen.push(k);try{localStorage.setItem('aga_pc_seen',JSON.stringify(seen))}catch(e){}}$('sv').classList.add('on');sframe()}
function sframe(){const n=NEWS[sk];clearInterval(stm);$('sv').innerHTML=`<div class="sv" style="background-image:url(${IM(n.i)})"><div class="bs"><i><b></b></i><i><b></b></i></div><button class="x" onclick="sclose()"><i class="fa-solid fa-xmark"></i></button><div class="hit"><div onclick="sstep(-1)"></div><div onclick="sstep(1)"></div></div><div class="cp"><span class="tag">${n.g}</span><h2 class="fj">${n.t}</h2>${sf?`<p style="color:#e2e8f0">${n.d}</p><button class="btn" onclick="sclose();site('${n.u}','${esc(n.l)}')">Detayı Aç →</button>`:''}</div></div>`;
  const bs=document.querySelectorAll('#sv .bs b');bs.forEach((b,i)=>b.style.width=i<sf?'100%':'0');let w=0;stm=setInterval(()=>{w+=2;if(bs[sf])bs[sf].style.width=w+'%';if(w>=100)sstep(1)},100)}
function sstep(d){sf+=d;if(sf<0){if(sk>0){sk--;sf=1}else sf=0}else if(sf>1){if(sk<NEWS.length-1){sk++;sf=0;if(!seen.includes(sk))seen.push(sk)}else return sclose()}sframe()}
function sclose(){clearInterval(stm);$('sv').classList.remove('on');render()}
/* ---- arama paleti ---- */
const IDX=[...Object.keys(PAGES).map(k=>({t:PAGES[k],s:'Sayfa',ic:'fa-compass',f:()=>go(k)})),...NEWS.map((n,k)=>({t:n.t,s:'Haber',ic:'fa-newspaper',f:()=>story(k)})),...PR.map(p=>({t:p[0],s:'Ürün',ic:'fa-bag-shopping',f:()=>site(p[3],p[0])}))];
const nz=s=>String(s).toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ü/g,'u');let rr=[],ri=0;
function find(){const q=nz($('q').value.trim());rr=(q?IDX.filter(x=>nz(x.t+' '+x.s).includes(q)):IDX.slice(0,8)).slice(0,9);ri=0;paint()}
function paint(){$('rs').innerHTML=rr.length?rr.map((x,i)=>`<div class="r ${i==ri?'on':''}" onclick="pick(${i})"><i class="fa-solid ${x.ic}"></i>${esc(x.t)}<small>${x.s}</small></div>`).join(''):'<p class="sub" style="padding:16px">Sonuç bulunamadı</p>'}
function pick(i){const x=rr[i];if(!x)return;$('pv').classList.remove('on');x.f()}
function pal(){$('pv').classList.add('on');$('q').value='';find();setTimeout(()=>$('q').focus(),30)}
$('sbar').onclick=pal;$('q').oninput=find;$('pv').onclick=e=>{if(e.target.id==='pv')$('pv').classList.remove('on')};
$('bell').onclick=e=>{e.stopPropagation();$('bell').classList.add('ring');setTimeout(()=>$('bell').classList.remove('ring'),700);$('pop').classList.toggle('on')};document.addEventListener('click',()=>$('pop').classList.remove('on'));
/* ---- tam ekran, kısayollar ---- */
const full=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$('fs').onclick=full;document.addEventListener('fullscreenchange',()=>$('fs').firstChild.className=document.fullscreenElement?'fa-solid fa-compress':'fa-solid fa-expand');
$('tg').onclick=()=>{document.body.classList.toggle('col');try{localStorage.setItem('aga_pc_col',document.body.classList.contains('col')?1:0)}catch(e){}};try{if(localStorage.getItem('aga_pc_col')==='1')document.body.classList.add('col')}catch(e){}
function enter(){if(document.body.classList.contains('in'))return;document.body.classList.add('in');if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}
document.addEventListener('keydown',e=>{const k=e.key;
  if(e.ctrlKey&&(k==='k'||k==='K')){e.preventDefault();pal()}else if(e.ctrlKey&&(k==='b'||k==='B')){e.preventDefault();$('tg').click()}
  else if(k==='F11'){e.preventDefault();full()}else if(k==='Escape'){$('pv').classList.remove('on');$('pop').classList.remove('on');if($('sv').classList.contains('on'))sclose();$('web').classList.remove('on')}
  else if($('pv').classList.contains('on')){if(k==='ArrowDown'){ri=Math.min(ri+1,rr.length-1);paint();e.preventDefault()}else if(k==='ArrowUp'){ri=Math.max(ri-1,0);paint();e.preventDefault()}else if(k==='Enter')pick(ri)}
  else if(e.altKey&&/^[1-5]$/.test(k)){e.preventDefault();go(['home','news','matches','wall','store'][+k-1])}});
try{if(!sessionStorage.getItem('agaMax')&&(outerWidth<screen.availWidth-40)){moveTo(0,0);resizeTo(screen.availWidth,screen.availHeight)}sessionStorage.setItem('agaMax','1')}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
const h0=location.hash.slice(1);if(PAGES[h0])cur=h0;render();$('wacc').innerHTML='<p class="sub" style="margin:0">Hesaplar yükleniyor…</p>';(sb?load():Promise.resolve()).then(()=>welcome('list'),()=>welcome('list'));
</script>
