<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#031119">
<title>AGA App</title>
<link rel="manifest" href="manifest-pc.webmanifest">
<!-- Site faviconu (değişmedi) -->
<link rel="icon" type="image/png" href="Untitled%20design%20(1)%20(1).png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) location.replace('index.html');</script>
<style>
:root{--gold:#c59b27;--gold2:#f9d976;--navy:#082231;--ink:#031119;--line:rgba(197,155,39,.18);--tb:env(titlebar-area-height,44px);--side:260px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#e2e8f0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1000px 560px at 8% -10%,rgba(197,155,39,.17),transparent 60%),radial-gradient(900px 640px at 108% 112%,rgba(197,155,39,.1),transparent 60%),linear-gradient(135deg,#082231,#031119 62%)}
button{font-family:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.fj{font-family:'Fjalla One',sans-serif;font-weight:400}
.gt{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Başlık çubuğu: sadece sürükleme alanı + sağ araçlar */
#titlebar{position:fixed;z-index:30;left:env(titlebar-area-x,0px);top:env(titlebar-area-y,0px);width:env(titlebar-area-width,100%);height:var(--tb);display:flex;align-items:center;gap:6px;padding:0 14px;user-select:none;-webkit-app-region:drag;app-region:drag}
#titlebar>*{-webkit-app-region:no-drag;app-region:no-drag}
#titlebar .sp{flex:1;-webkit-app-region:drag;app-region:drag;height:100%}
.tb-btn{width:34px;height:32px;border:0;border-radius:9px;background:transparent;color:#cbd5e1;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.tb-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.search{display:flex;align-items:center;gap:10px;width:320px;height:32px;padding:0 10px 0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#94a3b8;font-size:13px;transition:.2s}
.search:hover{border-color:rgba(197,155,39,.55);background:rgba(197,155,39,.08);color:#e2e8f0}
kbd{font-family:inherit;font-size:11px;color:#94a3b8;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:1px 6px}
.search kbd{margin-left:auto}
.tb-acc{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 4px;border-radius:999px;border:1px solid rgba(197,155,39,.5);background:rgba(197,155,39,.1);color:var(--gold2);font-size:13px;font-weight:600;transition:.2s}
.tb-acc:hover{background:rgba(197,155,39,.22);box-shadow:0 0 18px rgba(249,217,118,.28)}
.tb-acc img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#0b2e43}

/* Yan menü */
#side{position:fixed;z-index:20;left:0;top:0;bottom:0;width:var(--side);padding:12px 14px 16px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,rgba(8,34,49,.82),rgba(3,17,25,.82));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);transition:width .3s cubic-bezier(.4,0,.2,1)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 4px 18px;overflow:hidden;-webkit-app-region:drag;app-region:drag}
.brand img{width:46px;height:46px;border-radius:13px;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1.5px rgba(197,155,39,.6),0 8px 22px rgba(0,0,0,.5),0 0 20px rgba(197,155,39,.28)}
.brand b{display:block;font-size:24px;letter-spacing:1px;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:#64748b;white-space:nowrap}
.brand button{margin-left:auto;-webkit-app-region:no-drag;app-region:no-drag}
.sec{font-size:12px;font-weight:600;color:#64748b;padding:14px 10px 6px;white-space:nowrap;overflow:hidden}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 10px 0 8px;border:0;border-radius:14px;background:transparent;color:#cbd5e1;font-size:14.5px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;transition:background .2s,color .2s}
.item .ic{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:#94a3b8;font-size:15px;transition:.2s}
.item .lb{flex:1}.item kbd{margin-left:auto}
.item:hover{background:rgba(255,255,255,.05);color:#fff}.item:hover .ic{color:var(--gold2)}
.item.on{background:linear-gradient(90deg,rgba(197,155,39,.24),rgba(197,155,39,.03));color:#fff}
.item.on::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(var(--gold2),var(--gold));box-shadow:0 0 12px rgba(249,217,118,.8)}
.item.on .ic{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1202;box-shadow:0 6px 16px rgba(197,155,39,.42)}
.social{margin-top:auto;display:flex;gap:6px;padding:12px 4px 0;border-top:1px solid rgba(255,255,255,.06)}
.social a{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#94a3b8;background:rgba(255,255,255,.05);transition:.2s}
.social a:hover{color:#1a1202;background:var(--gold2)}
body.collapsed{--side:84px}
body.collapsed .brand div,body.collapsed .item .lb,body.collapsed .item kbd,body.collapsed .sec,body.collapsed .social a:nth-child(n+2){opacity:0;pointer-events:none}
body.collapsed .brand button{display:none}
body.collapsed .sec{height:8px;padding:0}

/* İçerik */
#stage{position:fixed;z-index:10;left:calc(var(--side) + 8px);right:10px;top:var(--tb);bottom:10px;border-radius:20px;overflow:hidden;background:var(--ink);box-shadow:0 0 0 1px rgba(197,155,39,.26),0 28px 70px rgba(0,0,0,.6);transition:left .3s cubic-bezier(.4,0,.2,1)}
body.full #titlebar,body.full #side{display:none}
body.full #stage{left:0;right:0;top:0;bottom:0;border-radius:0;box-shadow:none}
#view{width:100%;height:100%;border:0;display:block;background:var(--ink);opacity:0;transition:opacity .28s}
#view.show{opacity:1}
#native{position:absolute;inset:0;overflow:auto;display:none;padding:34px 40px 48px;background:radial-gradient(700px 400px at 90% 0,rgba(197,155,39,.09),transparent 60%),var(--ink);scrollbar-width:thin;scrollbar-color:#c59b27 #031119}
#bar{position:absolute;z-index:5;left:0;top:0;height:2.5px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 10px var(--gold2);transition:width .25s,opacity .3s}
#exitFull{position:fixed;z-index:40;top:12px;right:16px;display:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(197,155,39,.5);background:rgba(3,17,25,.88);color:var(--gold2);font-size:12.5px;font-weight:600}
body.full #exitFull{display:inline-flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s}
body.full #exitFull:hover,body.full #exitFull:focus-visible{opacity:1}

/* Ortak parçalar */
.wrap{max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.panel{background:linear-gradient(160deg,rgba(11,46,67,.55),rgba(3,17,25,.7));border:1px solid var(--line);border-radius:20px;padding:24px}
.panel h3{margin:0 0 16px;font-size:20px;letter-spacing:.5px;color:#fff}
.btn{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 20px;border-radius:12px;border:1px solid rgba(197,155,39,.5);background:rgba(197,155,39,.1);color:var(--gold2);font-size:14px;font-weight:600;transition:.2s}
.btn:hover{background:rgba(197,155,39,.22)}
.btn.gold{border:0;color:#1a1202;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 22px rgba(197,155,39,.35)}
.btn.gold:hover{filter:brightness(1.07)}
.muted{color:#94a3b8}
.row{display:flex;align-items:center;gap:14px}

/* Karşılama */
.welcome{grid-column:span 7;position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:38px}
.welcome::after{content:'';position:absolute;right:-60px;bottom:-70px;width:340px;height:340px;background:var(--crest) center/contain no-repeat;opacity:.1;filter:grayscale(.2)}
.welcome h1{margin:0;font-size:54px;line-height:1.05;letter-spacing:.5px;color:#fff}
.welcome p{margin:0;font-size:16px;line-height:1.6;max-width:46ch;color:#a9b8c6}
.cardcol{grid-column:span 5;display:flex;align-items:center;justify-content:center;perspective:900px}

/* Taraftar kartı */
.mcard{--rx:0deg;--ry:0deg;--mx:50%;--my:0%;position:relative;width:100%;max-width:430px;aspect-ratio:1.62;border-radius:22px;padding:22px 24px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;overflow:hidden;color:#fff;border:1.5px solid rgba(249,217,118,.55);background:radial-gradient(circle at var(--mx) var(--my),rgba(249,217,118,.22),transparent 55%),linear-gradient(145deg,#0d3550,#041823 70%);box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 40px rgba(197,155,39,.18);transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s ease-out,box-shadow .3s;cursor:pointer}
.mcard .top{display:flex;align-items:center;gap:10px}
.mcard .top img{width:30px;height:30px;object-fit:contain}
.mcard .top b{font-size:16px;letter-spacing:1px;display:block;line-height:1}
.mcard .top small{font-size:11px;color:#9fb3c4}
.mcard .chip{margin-left:auto;font-size:11px;font-weight:600;color:#9ff0b9;border:1px solid rgba(159,240,185,.4);border-radius:999px;padding:3px 10px}
.mcard .mid{display:flex;align-items:center;gap:14px;min-width:0}
.mcard .mid>img{width:70px;height:70px;border-radius:18px;object-fit:cover;background:#0b2e43;box-shadow:0 0 0 2px rgba(197,155,39,.6)}
.mcard .mid b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mid small{color:var(--gold2);font-size:13px}
.mcard .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mcard .bot small{display:block;font-size:11px;color:#8aa0b3}
.mcard .bot b{font-size:14px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
.mcard .bot div+div{margin-top:8px}
.mcard .qr{width:78px;height:78px;padding:5px;border-radius:12px;background:#fff;flex-shrink:0}
.mcard .qr svg{width:100%;height:100%;display:block}
.mcard.guest{place-content:center;text-align:center;grid-template-rows:none;gap:6px}
.mcard.guest i{font-size:30px;color:var(--gold2)}

/* Son maç */
.mt{grid-column:span 7}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;text-align:center}
.score img{width:72px;height:72px;object-fit:contain;margin:0 auto 8px;display:block}
.score .nm{font-weight:600;font-size:14px}
.score .sc{font-size:52px;letter-spacing:2px;color:#fff;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:16px;font-size:13px;color:#94a3b8}
.meta i{color:var(--gold);margin-right:6px}
.form{display:flex;gap:6px;justify-content:center;margin-top:16px}
.form span{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.form .G{background:rgba(52,211,153,.18);color:#6ee7b7}.form .B{background:rgba(148,163,184,.2);color:#cbd5e1}.form .M{background:rgba(248,113,113,.18);color:#fca5a5}
.rt{grid-column:span 5}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.rrow:first-of-type{border-top:0}
.rrow img{width:40px;height:40px;border-radius:12px;object-fit:cover;object-position:top;background:#0b2e43}
.rrow b{flex:1;font-size:14px}.rrow em{font-style:normal;font-size:12px;color:#94a3b8;display:block;font-weight:400}
.rrow .rate{font-size:20px;color:var(--gold2)}
.quick{grid-column:span 12;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tile{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff;text-align:left;font-size:15px;font-weight:600;transition:.2s}
.tile:hover{border-color:rgba(197,155,39,.6);background:rgba(197,155,39,.1)}
.tile .ic{width:44px;height:44px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1202;font-size:18px}
.tile small{display:block;color:#94a3b8;font-weight:400;font-size:12.5px;margin-top:2px}

/* Kadro */
.ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.ph h1{margin:0;font-size:44px;color:#fff;letter-spacing:.5px}.ph p{margin:6px 0 0;color:#94a3b8}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.pc{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4;border:1.5px solid var(--line);background:#031119;transition:transform .25s,border-color .25s,box-shadow .25s}
.pc:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 0 30px rgba(197,155,39,.45)}
.pc>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.pc::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,17,25,.1) 30%,rgba(3,17,25,.96))}
.pc .no{position:absolute;z-index:2;top:12px;left:16px;font-size:40px;color:transparent;-webkit-text-stroke:1.5px var(--gold2)}
.pc .inf{position:absolute;z-index:2;left:16px;right:16px;bottom:14px}
.pc .inf b{display:block;font-size:19px;color:#fff}.pc .inf small{color:var(--gold2);font-size:13px}
.pc .st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);text-align:center}
.pc .st b{font-size:16px}.pc .st small{display:block;color:#94a3b8;font-size:11px}

/* Profil / giriş */
.prof{display:grid;grid-template-columns:minmax(0,430px) 1fr;gap:28px;align-items:start}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn.red{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08);color:#fca5a5}
.post{padding:14px 0;border-top:1px solid rgba(255,255,255,.07)}
.post:first-child{border-top:0}
.post .h{display:flex;justify-content:space-between;font-size:13px;color:#94a3b8;margin-bottom:6px}.post .h b{color:var(--gold2)}
.post p{margin:0;line-height:1.55;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
textarea,.in{width:100%;border-radius:12px;border:1px solid rgba(197,155,39,.4);background:rgba(255,255,255,.05);color:#fff;font:15px 'Inter',sans-serif;padding:12px 14px;outline:0}
textarea{min-height:84px;resize:vertical;margin-bottom:10px}
textarea:focus,.in:focus{border-color:var(--gold2)}
.login{max-width:420px;margin:6vh auto 0;text-align:center}
.login h1{margin:14px 0 6px;font-size:36px;color:#fff}.login form{display:grid;gap:12px;margin-top:22px;text-align:left}
.msg{display:none;color:#fca5a5;font-size:13px}
.links{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:13.5px}.links a{color:var(--gold2);cursor:pointer}

/* Komut paleti */
#pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(1,8,12,.6);backdrop-filter:blur(8px)}
#pal.open{display:flex}
.pal-box{width:560px;max-width:92vw;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#0a2a3d,#031119);border:1px solid rgba(197,155,39,.45);box-shadow:0 30px 80px rgba(0,0,0,.75)}
.pal-box input{width:100%;height:58px;padding:0 20px;border:0;outline:0;background:transparent;color:#fff;font:500 16px 'Inter',sans-serif;border-bottom:1px solid var(--line)}
#palList{padding:8px;max-height:340px;overflow:auto}
.pal-row{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:#cbd5e1;font-size:14px;font-weight:600;text-align:left}
.pal-row i{width:20px;text-align:center;color:var(--gold)}.pal-row em{margin-left:auto;font-style:normal;font-size:12px;color:#64748b}
.pal-row.sel,.pal-row:hover{background:rgba(197,155,39,.18);color:#fff}
.pal-empty{padding:22px;text-align:center;color:#64748b;font-size:14px}
#cardOv{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(1,8,12,.72);backdrop-filter:blur(10px)}
#cardOv.open{display:flex}#cardOv .mcard{max-width:520px;cursor:default}

/* Açılış */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(circle at 50% 42%,#0b2e43,#031119 70%);transition:opacity .6s,visibility .6s}
body.ready #splash{opacity:0;visibility:hidden}
#splash img{width:104px;height:104px;border-radius:26px;object-fit:cover;box-shadow:0 0 0 2px rgba(197,155,39,.65),0 0 56px rgba(249,217,118,.45);animation:pulse 1.8s ease-in-out infinite}
#splash b{font-size:32px;letter-spacing:3px}
#splash i{display:block;width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
#splash i::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:slide 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}@keyframes slide{0%{left:-40%}100%{left:100%}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.welcome{animation:rise .6s both}
@media(max-width:1200px){.welcome,.cardcol,.mt,.rt{grid-column:span 12}.quick{grid-template-columns:repeat(2,1fr)}.prof{grid-template-columns:1fr}.search{width:40px;padding:0;justify-content:center}.search span,.search kbd{display:none}}
@media(max-width:900px){body:not(.collapsed){--side:84px}body:not(.collapsed) .brand div,body:not(.collapsed) .item .lb,body:not(.collapsed) .item kbd,body:not(.collapsed) .sec{opacity:0;pointer-events:none}#native{padding:24px 20px}.welcome h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><img src="Untitled%20design%20(3)%20(1).png" alt="AGA App"><b class="fj gt">AGA App</b><i></i></div>

<div id="titlebar">
  <div class="sp"></div>
  <button class="search" id="btnPal" aria-label="Ara ve git"><i class="fa-solid fa-magnifying-glass"></i><span>Sayfa ara veya komut yaz</span><kbd>Ctrl K</kbd></button>
  <button class="tb-btn" id="btnFull" title="Tam ekran (F11)" aria-label="Tam ekran"><i class="fa-solid fa-expand"></i></button>
  <button class="tb-acc" id="btnAcc"><img id="accImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=aga" alt=""><span id="accLabel">Giriş yap</span></button>
</div>

<aside id="side">
  <div class="brand"><img src="Untitled%20design%20(3)%20(1).png" alt=""><div><b class="fj gt">AGA App</b><small>Agaistan FC</small></div><button class="tb-btn" id="btnSide" title="Menüyü daralt (Ctrl+B)" aria-label="Menüyü daralt"><i class="fa-solid fa-angles-left"></i></button></div>
  <div class="sec">Kulüp</div>
  <button class="item on" data-go="home"><span class="ic"><i class="fa-solid fa-house"></i></span><span class="lb">Ana sayfa</span><kbd>Alt 1</kbd></button>
  <button class="item" data-go="squad"><span class="ic"><i class="fa-solid fa-people-group"></i></span><span class="lb">Kadromuz</span><kbd>Alt 2</kbd></button>
  <button class="item" data-go="news"><span class="ic"><i class="fa-solid fa-newspaper"></i></span><span class="lb">Haberler</span><kbd>Alt 3</kbd></button>

function tilt(root){root.querySelectorAll('.mcard:not(.guest)').forEach(function(c){

   '<div class="meta"><span><i class="fa-regular fa-calendar"></i>'+esc(m.tarih)+(m.saat?' · '+esc(m.saat):'')+'</span><span><i class="fa-solid fa-trophy"></i>'+esc(m.lig)+'</span><span><i class="fa-solid fa-location-dot"></i>'+esc(m.stadyum)+'</span></div>'+

  var r=MATCH.reyting||{};

}
function playerHtml(p){var s=p.stats||{};return '<article class="pc"><span class="no fj">'+esc(p.number)+'</span><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'"><div class="inf"><b class="fj">'+esc(p.name)+'</b><small>'+esc(p.role)+'</small><div class="st"><div><b>'+esc(s.mac)+'</b><small>Maç</small></div><div><b>'+esc(s.gol)+'</b><small>Gol</small></div><div><b>'+esc(s.asist)+'</b><small>Asist</small></div><div><b>'+esc(s.reyting)+'</b><small>OVR</small></div></div></div></article>'}

}

   '<div class="links"><a data-site="register">Hesap oluştur</a><a data-site="forgot">Şifremi unuttum</a></div></div>';

  return '<div class="wrap"><div class="ph"><div><h1 class="fj gt">'+esc(user.name||'Profilim')+'</h1><p>@'+esc(user.username||'')+' · üyelik '+esc(user.join_date||'-')+'</p></div></div>'+
   '<div class="prof"><div>'+cardHtml()+'<div class="acts"><button class="btn gold" id="pCard"><i class="fa-solid fa-qrcode"></i>Kartı büyüt</button><button class="btn" data-site="edit"><i class="fa-solid fa-user-pen"></i>Profili düzenle</button><button class="btn" data-site="password"><i class="fa-solid fa-key"></i>Şifre değiştir</button><button class="btn red" id="pOut"><i class="fa-solid fa-right-from-bracket"></i>Oturumu kapat</button></div></div>'+

function loadPosts(){
  var box=$('posts');if(!box||!sb)return;
  sb.from('blog_posts').select('id,text,created_at,profiles(name,username)').order('created_at',{ascending:false}).limit(30).then(function(r){
    var d=r.data;if(!d||!d.length){box.innerHTML='<p class="muted">Henüz paylaşım yok. İlk paylaşımı sen yap.</p>';return}
    box.innerHTML=d.map(function(p){var n=p.profiles?p.profiles.name:'Aga taraftarı',u=p.profiles?p.profiles.username:'',t=new Date(p.created_at);
      return '<div class="post"><div class="h"><span><b>'+esc(n)+'</b> @'+esc(u)+'</span><span>'+t.toLocaleDateString('tr-TR')+' '+t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'</span></div><p>'+esc(p.text)+'</p></div>'}).join('');
  });

/* ---- Gezinme ---- */
function progress(p,hide){bar.style.opacity=1;bar.style.width=p+'%';if(hide)setTimeout(function(){bar.style.opacity=0;setTimeout(function(){bar.style.width='0'},300)},250)}
function setActive(k){document.querySelectorAll('.item[data-go]').forEach(function(b){var g=b.getAttribute('data-go');b.classList.toggle('on',g===k||(k==='login'&&g==='profile'))});document.title=PAGES[k].t+' · AGA App'}
var APP_CSS='.header-wrapper,#headerWrapper,.combined-footer-wrapper,.footer-container,#mTopBar,#mBottomNav,#mSheet,#smallA2hsBar,#a2hsOverlay,#a2hsModal,.pc-a2hs,#pcA2hsOverlay,#pcA2hsModal{display:none!important}.main-content{margin-top:22px!important}html{scrollbar-width:thin;scrollbar-color:#c59b27 #031119}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#031119}::-webkit-scrollbar-thumb{background:linear-gradient(#c59b27,#a17a15);border-radius:10px;border:2px solid #031119}';
function keyFromPath(p){p=(p||'').toLowerCase();if(p.indexOf('haberler')>-1)return 'news';if(p.indexOf('tarihcemiz')>-1)return 'history';if(p.indexOf('kadromuz')>-1)return 'squad';if(p.indexOf('agastore')>-1||p.indexOf('agaistan-fc-')>-1||p.indexOf('adidas-x-aga')>-1)return 'store';return 'home'}
function inject(){try{var d=view.contentDocument,w=view.contentWindow;if(!d||!d.head||w.location.href==='about:blank')return false;
  if(!d.getElementById('aga-app-css')){var s=d.createElement('style');s.id='aga-app-css';s.textContent=APP_CSS;d.head.appendChild(s);w.addEventListener('beforeunload',function(){view.classList.remove('show');progress(35);startWatch()});d.addEventListener('keydown',onKey)}return true}catch(e){return false}}
function startWatch(){clearInterval(watch);var n=0;watch=setInterval(function(){if(inject()||++n>160)clearInterval(watch)},25)}
function showFrame(url){nat.style.display='none';view.style.display='block';view.classList.remove('show');progress(30);view.src=url;startWatch()}
function renderNative(){
  view.style.display='none';nat.style.display='block';nat.scrollTop=0;
  nat.innerHTML=cur==='home'?vHome():cur==='squad'?vSquad():cur==='login'?vLogin():vProfile();
  tilt(nat);
  if(cur==='profile')loadPosts();
}
function go(k){
  if(k==='profile'&&!user)k='login';
  if(k==='login'&&user)k='profile';
  var p=PAGES[k];if(!p)return;cur=k;setActive(k);
  if(p.n)renderNative();else showFrame(p.url);
}
// Site sayfasını (kayıt, şifre, profil düzenleme) uygulama içinde aç
function openSite(page){pending=page;cur='home';setActive('home');showFrame('index.html')}
function openAI(){pending='__ai';cur='home';setActive('home');showFrame('index.html')}
view.addEventListener('load',function(){
  if(view.contentWindow.location.href==='about:blank')return;
  inject();progress(100,true);view.classList.add('show');
  try{var k=keyFromPath(view.contentWindow.location.pathname);if(PAGES[k]&&!PAGES[k].n)setActive(k)}catch(e){}
  if(pending){var p=pending;pending=null;setTimeout(function(){try{var w=view.contentWindow;if(p==='__ai')w.toggleAgaAiModal();else w.showPage(p)}catch(e){}},700)}
  setTimeout(function(){document.body.classList.add('ready')},Math.max(0,1000-(Date.now()-shownAt)));
});

// Tıklamalar (yan menü ve sayfa içi)
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'),s=e.target.closest('[data-site]'),a=e.target.closest('[data-act]');
  if(g)go(g.getAttribute('data-go'));else if(s)openSite(s.getAttribute('data-site'));else if(a&&a.getAttribute('data-act')==='login')go('login');
  else if(e.target.closest('#qAI'))openAI();
  else if(e.target.closest('#pCard'))openCard();
  else if(e.target.closest('#pOut')){sb.auth.signOut().then(function(){user=null;loadUser();go('home')})}
  else if(e.target.closest('#pPost')){var t=$('pText').value.trim();if(!t||!sb)return;sb.from('blog_posts').insert([{user_id:user.id,text:t}]).then(function(r){if(r.error){alert('Gönderi paylaşılamadı: '+r.error.message);return}$('pText').value='';loadPosts()})}
  else if(e.target.closest('.mcard:not(.guest)')&&!e.target.closest('#cardOv'))openCard();
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='fLogin')return;e.preventDefault();var m=$('lMsg');m.style.display='none';
  sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value.trim()}).then(function(r){
    if(r.error){m.textContent='E-posta veya şifre hatalı. Kontrol edip tekrar dene.';m.style.display='block';return}
    loadUser().then(function(){go('profile')});
  });
});
$('btnAcc').addEventListener('click',function(){go(user?'profile':'login')});
$('btnCard').addEventListener('click',openCard);
$('btnAI').addEventListener('click',openAI);
if(sb)sb.auth.onAuthStateChange(function(){loadUser().then(function(){if(PAGES[cur]&&PAGES[cur].n)go(cur)})});

function toggleSide(){document.body.classList.toggle('collapsed');try{localStorage.setItem('agaSideCollapsed',document.body.classList.contains('collapsed')?'1':'0')}catch(e){}}
try{if(localStorage.getItem('agaSideCollapsed')==='1')document.body.classList.add('collapsed')}catch(e){}
$('btnSide').addEventListener('click',toggleSide);
function reload(){if(PAGES[cur].n){loadSiteData().then(loadUser).then(function(){go(cur)})}else{try{view.classList.remove('show');progress(30);view.contentWindow.location.reload();startWatch()}catch(e){go('home')}}}
function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}
$('btnFull').addEventListener('click',toggleFull);$('exitFull').addEventListener('click',toggleFull);
document.addEventListener('fullscreenchange',function(){var on=!!document.fullscreenElement;document.body.classList.toggle('full',on);$('btnFull').firstElementChild.className=on?'fa-solid fa-compress':'fa-solid fa-expand'});

/* ---- Komut paleti ---- */
var palSel=0,palItems=[];
function palRender(){
  var q=$('palIn').value.trim().toLocaleLowerCase('tr');
  var c=ORDER.map(function(k,i){return{l:PAGES[k].t+' sayfasını aç',i:PAGES[k].ic,h:'Alt '+(i+1),r:function(){go(k)}}});
  c.push({l:'Taraftar kartımı aç',i:'fa-qrcode',h:'',r:openCard},{l:'AGA AI asistanını aç',i:'fa-wand-magic-sparkles',h:'',r:openAI},{l:'Tam ekrana geç',i:'fa-expand',h:'F11',r:toggleFull},{l:'Sayfayı yenile',i:'fa-rotate-right',h:'F5',r:reload},{l:'Menüyü daralt / genişlet',i:'fa-table-columns',h:'Ctrl B',r:toggleSide});
  if(user)c.push({l:'Oturumu kapat',i:'fa-right-from-bracket',h:'',r:function(){sb.auth.signOut().then(function(){user=null;loadUser();go('home')})}});
  palItems=c.filter(function(x){return x.l.toLocaleLowerCase('tr').indexOf(q)>-1});palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $('palList').innerHTML=palItems.length?palItems.map(function(x,i){return '<button class="pal-row'+(i===palSel?' sel':'')+'" data-i="'+i+'"><i class="fa-solid '+x.i+'"></i>'+x.l+'<em>'+x.h+'</em></button>'}).join(''):'<div class="pal-empty">Eşleşen komut yok. Başka bir kelime dene.</div>';
}
function palOpen(){$('pal').classList.add('open');$('palIn').value='';palSel=0;palRender();$('palIn').focus()}
function palClose(){$('pal').classList.remove('open')}
function palRun(i){var c=palItems[i];if(!c)return;palClose();c.r()}
$('btnPal').addEventListener('click',palOpen);
$('palIn').addEventListener('input',function(){palSel=0;palRender()});
$('palList').addEventListener('click',function(e){var b=e.target.closest('.pal-row');if(b)palRun(+b.getAttribute('data-i'))});
$('pal').addEventListener('mousedown',function(e){if(e.target===$('pal'))palClose()});

function onKey(e){
  if($('pal').classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();palClose()}
    else if(e.key==='ArrowDown'){e.preventDefault();palSel=(palSel+1)%Math.max(1,palItems.length);palRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel=(palSel-1+palItems.length)%Math.max(1,palItems.length);palRender()}
    else if(e.key==='Enter'){e.preventDefault();palRun(palSel)}return}
  if(e.key==='Escape'&&$('cardOv').classList.contains('open')){$('cardOv').classList.remove('open');return}
  if(e.ctrlKey&&(e.key==='k'||e.key==='K')){e.preventDefault();palOpen()}
  else if(e.altKey&&/^[1-6]$/.test(e.key)){e.preventDefault();go(ORDER[+e.key-1])}
  else if(e.ctrlKey&&(e.key==='b'||e.key==='B')){e.preventDefault();toggleSide()}
  else if(e.key==='F11'){e.preventDefault();toggleFull()}
  else if(e.key==='F5'||(e.ctrlKey&&(e.key==='r'||e.key==='R'))){e.preventDefault();reload()}
  else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();try{view.contentWindow.history.back()}catch(x){}}
  else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();try{view.contentWindow.history.forward()}catch(x){}}
}
document.addEventListener('keydown',onKey);

// Kurulu uygulama penceresini ekranı kaplayacak şekilde büyüt
try{var inApp=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches;
  if(inApp&&!sessionStorage.getItem('agaMax')){window.moveTo(0,0);window.resizeTo(screen.availWidth,screen.availHeight)}sessionStorage.setItem('agaMax','1')}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){})}

setTimeout(function(){document.body.classList.add('ready')},6000);
Promise.all([loadSiteData(),loadUser()]).then(function(){go('home');setTimeout(function(){document.body.classList.add('ready')},Math.max(0,900-(Date.now()-shownAt)))});
})();
</script>
