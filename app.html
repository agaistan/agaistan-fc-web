<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#031119">
<title>AGA App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="Untitled design (1).png">
<script>
  // Dar ekranda (telefon/tablet) çerçeve gerekmez, doğrudan siteyi aç
  if (window.innerWidth <= 900) location.replace('index.html');
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #031119; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 18% 22%, rgba(197,155,39,.14), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(197,155,39,.10), transparent 45%),
      linear-gradient(135deg, #082231 0%, #031119 100%);
  }
  .shell {
    width: min(430px, 100vw); height: 100vh; height: 100dvh; max-height: 980px;
    background: #031119; overflow: hidden; position: relative;
    box-shadow: 0 0 0 1.5px rgba(197,155,39,.45), 0 24px 70px rgba(0,0,0,.75), 0 0 40px rgba(197,155,39,.18);
  }
  @media (min-width: 520px) and (min-height: 760px) { .shell { border-radius: 22px; height: calc(100vh - 28px); height: calc(100dvh - 28px); } }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #031119; }
</style>
</head>
<body>
  <div class="shell">
    <iframe src="index.html" title="AGA App" allow="clipboard-write; fullscreen; autoplay"></iframe>
  </div>
</body>
</html>
